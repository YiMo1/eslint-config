name: npm publish

permissions:
  id-token: write
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: setup pnpm
        uses: pnpm/action-setup@v6

      - name: install dependencies
        run: pnpm install

      - name: build
        run: pnpm build

      - name: publish
        run: npm publish
